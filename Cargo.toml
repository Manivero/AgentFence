[workspace]
members = [
    "crates/core",
    "crates/policy",
    "crates/enforcement",
    "crates/audit",
    "crates/approval",
    "crates/mcp",
    "crates/shell",
    "crates/network",
    "crates/secrets",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AgentFence Contributors"]
repository = "https://github.com/Manivero/AgentFence"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
