[package]
name = "agentfence-wasm-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly sandbox runtime for AgentFence policy plugins"

[dependencies]
agentfence-core = { path = "../core" }
# SECURITY: 48.0.7 is affected by RUSTSEC-2026-0422 (insufficient type-check on
# i31/nullref arguments) and a cross-engine type-confusion advisory. The floor
# is pinned here because Cargo.lock is gitignored in this repository, so a fresh
# resolution must not be able to select a vulnerable build.
wasmtime = { version = "48.0.8", default-features = false, features = ["runtime", "cranelift", "component-model", "wat", "std"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"


