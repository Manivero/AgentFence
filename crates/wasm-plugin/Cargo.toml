[package]
name = "agentfence-wasm-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly sandbox runtime for AgentFence policy plugins"

[dependencies]
agentfence-core = { path = "../core" }
wasmtime = { version = "48.0.7", default-features = false, features = ["runtime", "cranelift", "component-model", "wat", "std"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"


