[package]
name = "agentfence-test-guest"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Test WebAssembly guest for AgentFence policy plugin sandbox"

# This crate is intentionally NOT a member of the AgentFence workspace:
# it is compiled to wasm32-wasip1 and then wrapped into a component with
# `wasm-tools component new`. Declaring an empty [workspace] makes it a
# standalone workspace root so Cargo does not treat it as a member of the
# parent workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.39"

