# cargo-deny configuration for AgentFence
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
# The confidence threshold is used to determine whether a license is
# "clearly" a match or not.
confidence-threshold = 0.8

# Licenses that are explicitly allowed.
# MIT is the license of AgentFence itself and most of its dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered.
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is
# not in the allow list is encountered.
unknown-git = "warn"
# List of URLs for allowed crate registries.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories.
allow-git = []

[advisories]
# The path where the advisory database is cloned/fetched into.
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use.
db-urls = ["https://github.com/rustsec/advisory-db"]
# A list of advisory IDs to ignore.
ignore = [
    "RUSTSEC-2024-0449",  # unsafe-libyaml is unmaintained
]
